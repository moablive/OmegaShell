# CloudShell — tmux próprio (socket -L cloudshell, não mistura com os tmux do servidor).
# Instalado em /usr/local/lib/cloudshell/ (com sessao.sh e fechar-conselho.sh) por
# ~/sh/cloudshell-host-endurecer.sh — o hook client-detached precisa do fechar-conselho.sh lá.

set -g default-terminal "tmux-256color"
set -g mouse on
# Copiar e colar (24/10/2026): arrastar com o mouse seleciona no tmux e, ao soltar, a seleção vai
# por OSC 52 para o navegador (o nginx injeta um leitor de OSC 52 no xterm do ttyd, que grava na
# área de transferência). Option+arrastar (Shift fora do Mac) seleciona direto no navegador, que
# o ttyd copia sozinho. Colar é o Cmd+V / Ctrl+Shift+V do navegador.
set -s set-clipboard on
set -as terminal-features ',xterm*:clipboard'
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "CloudShell · #W"

# Divisões (24/10/2026): borda grossa e visível (a ativa em roxo, setas amarelas ←→/↑↓ junto
# dela) para achar e ARRASTAR com o mouse (MouseDrag1Border = resize-pane -M, padrão do tmux); faixa no topo de cada painel quando a
# janela está dividida, também arrastável; clique duplo numa borda iguala os tamanhos. O botão
# "☰ menu → ⇔ Tamanho…" tem tamanhos prontos e tela cheia.
set -g pane-border-lines heavy
set -g pane-border-style "fg=#3a3a5a"
set -g pane-active-border-style "fg=#b388ff"
set -g pane-border-indicators colour
set -g pane-border-status top
# Setas de "arraste aqui" na faixa, encostadas na borda que se arrasta: ←→ no começo (borda à
# esquerda do painel) e no fim (borda à direita); ↑↓ quando há painel em cima. Nada na borda da tela.
set -g pane-border-format "#{?pane_at_left,,#[fg=#ffd43b#,bold]←→ }#{?pane_active,#[fg=#b388ff#,bold],#[fg=#6c6c8a]} #{pane_index}: #{pane_current_command} #{?pane_at_top,,#[fg=#ffd43b#,bold]↑↓ }#[align=right]#{?pane_at_right,,#[fg=#ffd43b#,bold] ←→}"
bind -n DoubleClick1Border select-layout -E

# Barra em cima, nas cores do CloudShell. Cada aba é clicável; sem botões desde 27/10/2026 (o ☰ menu de
# 26/10/2026 saiu: o menu de ações abre pelo ⌥ Tab, User3 abaixo).
set -g status-position top
# Barra com 2 linhas (28/10/2026, pedido do dono: "aumente um pouco o tamanho da aba"): a página do OmegaShell
# (pwa/botoes.js) desenha na 2ª linha a faixa de cada aba, na cor da aba, com os logos nas duas linhas; a marca ⠀
# (braille em branco) na 1ª coluna da 2ª linha é como ela sabe que a linha existe.
# A 2ª linha é um ESPELHO da 1ª (30/10/2026, pedido do dono: "não está funcionando"): até então ela era só a
# marca, e o tmux só sabe que aba está embaixo do mouse pelos #[range=window] da linha — na metade de baixo
# da aba, clique, arrasto e roda do mouse não faziam nada (MouseDown1StatusDefault, sem ação). Com o mesmo
# formato nas duas linhas os ranges batem coluna a coluna; a faixa da página cobre o texto repetido. @sf0
# guarda o status-format padrão do tmux (lido UMA vez: no source-file de novo ele já não seria o padrão) e as
# duas linhas ganham 1 coluna à esquerda, " " na 1ª e "⠀" na 2ª, para continuarem alinhadas.
set -g status 2
if -F "#{==:#{@sf0},}" "set -gF @sf0 '#{status-format[0]}'"
set -g status-format[0] " #{E:@sf0}"
set -g status-format[1] "⠀#{E:@sf0}"
set -g status-style "bg=#14141f,fg=#e6e6f0"
# Sem os botões "☰ CloudShell" e "☰ menu" (27/10/2026, pedido do dono: o ⌥ Tab sempre traz os menus; a página
# inicial fica no ⌂ e no ⌥ Tab). As janelas fixas conselho, omega e sh não aparecem como abas; quando a ativa é uma
# delas, o nome dela aparece em azul à esquerda, só como rótulo.
set -g status-left "#{?@jfixa,#[bg=#4dabf7#,fg=#14141f#,bold] #W #[default] ,}"
set -g status-left-length 40
# Cor da aba (⌥ C ou Ctrl-b C → paleta de caixinhas; saiu do ☰ menu em 27/10/2026): opção @cor da janela. Sem cor, o padrão de sempre (aba ativa roxa);
# com cor, a aba fica nela, e a ativa leva ainda negrito (o sublinhado saiu em 28/10/2026: a página marca a ativa com um brilho). Hex em minúsculas: "#H"
# e afins são formatos do tmux. "#," = vírgula dentro do #{?…}.
# As janelas fixas conselho, omega e sh são SEMPRE azuis (era vermelho até 25/10/2026, pedido do dono): a barra testa o
# nome antes do @cor; nelas o ⌥ C e o Ctrl-b C só avisam.
# Cor inicial pelo servidor (28/10/2026, pedido do dono): sem @cor, aba do srv2 (bf-*) é vermelha e a do
# awlsrv (awlsrv-*, shell, nova-sessao…) é azul; a do Mac (mac-*) fica no padrão. O ⌥ C muda; "Padrão" volta a ela.
# Grupos de abas (25/10/2026, "☰ menu → ▦ Grupo…" + host/abas.sh): a 1ª aba de cada grupo leva o rótulo
# "▾ nome" (amarelo) antes dela; grupo recolhido mostra só "▸ nome (N)" — N = quantas abas tem — e
# esconde as abas dele. Sem separador entre abas: aba escondida não deixa espaço sobrando, e
# cada aba visível traz o seu espaço no fim.
# O rótulo é um botão (26/10/2026, pedido do dono): área user|g@<janela> da barra; um clique recolhe
# (e tira o foco do grupo), outro expande. Depois dele a área volta a ser a da aba (range=window).
set -g @g_rotulo "#{?@g_ini,#[norange]#[range=user|g#{window_id}]#[bg=#2b2b44#,fg=#ffd43b#,bold] #{?#{m:*|#{@grupo}|*,#{@recolhidos}},▸ #{@grupo} (#{@g_n}),▾ #{@grupo}} #[norange default]#[range=window|#{window_index}],}"
# Rótulo da aba (28/10/2026, pedido do dono): o ícone oficial do servidor e o da IA no lugar do prefixo do nome.
# No texto são marcas — 🌊 awlsrv (Astral Wave), 🥩 srv2 (cliente), 🍎 mac, cada uma com 3
# espaços (5 células); 🤖 Claude, ✨ Gemini, 💻 terminal (@omega_ia, posto pelo omega) — e a página do OmegaShell
# (pwa/botoes.js) pinta por cima delas o logo oficial (logos.js) e o da IA. O nome da janela continua
# awlsrv-/bf-/mac- (o omega e o abas.sh acham a aba por ele); só a exibição muda.
set -g @aba_rotulo "#{?#{m:awlsrv-*,#{window_name}},🌊   ,#{?#{m:bf-*,#{window_name}},🥩   ,#{?#{m:mac-*,#{window_name}},🍎   ,}}}#{?#{==:#{@omega_ia},claude},🤖 ,#{?#{==:#{@omega_ia},gemini},✨ ,#{?#{==:#{@omega_ia},terminal},💻 ,}}}#{s/^(awlsrv|bf|mac)-//:window_name}"
# Cor da aba (28/10/2026, pedido do dono): toda aba nasce PRETA com a fonte branca, até ele dar uma cor (⌥ C,
# @cor); aba colorida leva a fonte preta. Saiu a cor inicial por servidor (bf vermelha, mac cinza, azul).
# Sem o número "N:" na aba (28/10/2026, pedido do dono: o ícone do servidor/IA fica no lugar dele); a ativa sem
# sublinhado, só em negrito — o negrito é como o pwa/botoes.js acha a ativa para dar o brilho dela.
set -g window-status-separator ""
setw -g window-status-format "#{?@jfixa,,#{?#{&&:#{@grupo},#{m:*|#{@grupo}|*,#{@recolhidos}}},#{?@g_ini,#{E:@g_rotulo} ,},#{E:@g_rotulo}#{?#{||:#{||:#{==:#{window_name},omega},#{==:#{window_name},sh}},#{==:#{window_name},conselho}},#[bg=#4dabf7#,fg=#14141f],#{?@cor,#[bg=#{@cor}#,fg=#000000],#[bg=#000000#,fg=#ffffff]}} #{E:@aba_rotulo} #[default] }}"
setw -g window-status-current-format "#{?@jfixa,,#{E:@g_rotulo}#{?#{||:#{||:#{==:#{window_name},omega},#{==:#{window_name},sh}},#{==:#{window_name},conselho}},#[bg=#4dabf7#,fg=#14141f#,bold],#{?@cor,#[bg=#{@cor}#,fg=#000000#,bold],#[bg=#000000#,fg=#ffffff#,bold]}} #{E:@aba_rotulo} #[default] }"
set -g status-right ""
set -g status-right-length 0

# Menu de ações (o "☰ menu", hoje aberto pelo ⌥ Tab): + Nova janela, ⫼ Dividir, ✕ Fechar shell, ▦ Grupo…, ⇄ Mover… e ⇔ Tamanho… (as
# reticências abrem um segundo menu no mesmo lugar). As letras são atalhos dentro do menu.
# O menu é montado pelo host/abas.sh (ação painel, 26/10/2026): o ⇄ Mover abre como dropdown dentro
# dele (← → ⇤ ⇥ logo abaixo) e o menu fica aberto a cada clique, para ir clicando nos lados; Esc fecha.
# "✕ Fechar shell" fecha o painel ativo (a janela inteira, se for o único) depois de confirmar
# com y — clique sem querer não mata o shell; no painel fixo de conselho, omega e sh (@pfixa,
# host/fixas.sh) ele fica apagado — painel aberto ao lado dele com ⫼ Dividir fecha normal.
# Fechar a última janela encerra a sessão; ao reabrir, o sessao.sh recria.
bind -n MouseDown1Status {
  if -F "#{m:g@*,#{mouse_status_range}}" {
    run-shell "/usr/local/lib/cloudshell/abas.sh clique #{socket_path} #{s/^g//:mouse_status_range}"
  } {
    select-window -t =
  }
}

# Arrastar uma aba pela barra troca ela de lugar (25/10/2026); ao soltar, os rótulos dos grupos
# são refeitos (a aba arrastada continua no grupo dela: "▦ Grupo…" → "Juntar" reagrupa).
# Nunca tinha funcionado (30/10/2026, medido com o log do tmux 3.7c): num atalho de mouse a janela "atual" do
# comando é a que está SOB O MOUSE, então `swap-window -t =` trocava a aba com ela mesma; e sem -d a ativa não
# seguia a arrastada, que voltava no movimento seguinte. Agora o abas.sh recebe a aba ativa (a que o clique
# selecionou e está sendo arrastada) e a que está embaixo do mouse, troca as duas e segue na arrastada.
bind -n MouseDrag1Status run-shell "/usr/local/lib/cloudshell/abas.sh arrasta #{socket_path} #{W:#{?window_active,#{window_id},}} #{window_id}"
bind -n MouseDragEnd1Status run-shell "/usr/local/lib/cloudshell/abas.sh marca #{socket_path} #{window_id}"

# Atalho Option+C (24/10/2026; era Cmd+Shift+C): a página do CloudShell (script injetado pelo
# nginx) troca o Option+C pela sequência \e[99~, que o tmux lê como a tecla User0 (abaixo: a paleta de cores).
# O Ctrl-b C abre a mesma paleta (no lugar do
# customize-mode do tmux). Cor vazia = padrão (o #{?@cor,…} da barra trata vazio como sem cor).
set -s user-keys[0] "\e[99~"
# Option+C abre a paleta de cores (27/10/2026, pedido do dono; até então passava para a próxima cor a cada toque):
# o "◐ Cor…" do abas.sh painel, que no navegador vira esferas coloridas. Nas fixas ele só avisa.
bind -n User0 run-shell "/usr/local/lib/cloudshell/abas.sh painel #{socket_path} #{window_id} #{client_name} cor"
# Option+V (24/10/2026; era Cmd+Shift+V): a página troca o atalho por \e[98~ (User1) — divide a tela ao lado e
# a metade nova abre no omega. Sem OMEGA_ABAS, o que se escolhe nele (sessão, ~/sh) abre ali
# mesmo, dentro da divisão; q no omega fecha a divisão.
set -s user-keys[1] "\e[98~"
bind -n User1 split-window -h -c "#{pane_current_path}" "/usr/local/bin/omega"
# Option+G (25/10/2026): a página troca o atalho por \e[97~ (User2). Desde 27/10/2026 (pedido do dono) abre o
# "agrupar abas" (abas.sh juntar): as abas em caixinhas para marcar várias, ➕ Criar grupo… e Pôr em <grupo>.
# O menu de grupo da aba ativa continua no "☰ menu → ▦ Grupo…".
set -s user-keys[2] "\e[97~"
bind -n User2 run-shell "/usr/local/lib/cloudshell/abas.sh juntar #{socket_path} #{window_id} #{client_name}"
# Option+Tab (26/10/2026, pedido do dono: o atalho dos botões, como o Cmd+Tab): na aba sem menu próprio a
# página manda \e[96~ (User3) e abre o "☰ menu" — abas para trocar (a última usada primeiro) e ações — em
# botões. Na omega e na sh o ⌥ Tab mostra o menu delas, que a página já tem guardado. CS_ATALHO=1 (27/10/2026): pelo
# atalho o menu traz também a omega e a sh no começo (o clique no ☰ menu não traz).
set -s user-keys[3] "\e[96~"
bind -n User3 run-shell "CS_ATALHO=1 /usr/local/lib/cloudshell/abas.sh painel #{socket_path} #{window_id} #{client_name}"
# Página inicial (27/10/2026, pedido do dono: pwa/inicio.js): cada cartão digita uma destas teclas.
# \e[95~ conselho · \e[94~ omega · \e[93~ sh · \e[92~ nova sessão (a mesma aba do 🖥️ Nova sessão… do ☰ menu).
set -s user-keys[4] "\e[95~"
bind -n User4 select-window -t :=conselho
set -s user-keys[5] "\e[94~"
bind -n User5 select-window -t :=omega
set -s user-keys[6] "\e[93~"
bind -n User6 select-window -t :=sh
set -s user-keys[7] "\e[92~"
bind -n User7 new-window -n nova-sessao -e OMEGA_ABAS=1 "/usr/local/bin/omega nova"
# Ctrl-b C (27/10/2026): a mesma paleta de caixinhas do ⌥ C (era o menu de cores em texto do tmux).
bind C run-shell "/usr/local/lib/cloudshell/abas.sh painel #{socket_path} #{window_id} #{client_name} cor"

# Teclado também: Ctrl-b c (nova), Ctrl-b % (dividir), Ctrl-b x (fechar) — os padrões do tmux continuam.

# Janelas fixas conselho, omega e sh não fecham (26/10/2026, pedido do dono). host/fixas.sh marca
# @jfixa na janela e @pfixa no painel fixo dela; aqui Ctrl-b x / & / , e os menus do botão direito
# (os padrões do tmux 3.7, com Kill e Rename apagados nelas) só avisam.
bind x if -F "#{@pfixa}" { display-message "a aba #W é fixa: não fecha" } { confirm-before -p "kill-pane #P? (y/n)" kill-pane }
bind & if -F "#{@jfixa}" { display-message "a aba #W é fixa: não fecha" } { confirm-before -p "kill-window #W? (y/n)" kill-window }
bind , if -F "#{@jfixa}" { display-message "a aba #W é fixa: o nome não muda" } { command-prompt -I "#W" { rename-window "%%" } }
bind -n MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' "#{?@jfixa,-,}Kill" X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?@jfixa,-,}Rename" n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
bind -n M-MouseDown3Status display-menu -T "#[align=centre]#{window_index}:#{window_name}" -t = -x W -y W "#{?#{>:#{session_windows},1},,-}Swap Left" l { swap-window -t :-1 } "#{?#{>:#{session_windows},1},,-}Swap Right" r { swap-window -t :+1 } "#{?pane_marked_set,,-}Swap Marked" s { swap-window } '' "#{?@jfixa,-,}Kill" X { kill-window } Respawn R { respawn-window -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?@jfixa,-,}Rename" n { command-prompt -F -I "#W" { rename-window -t "#{window_id}" "%%" } } '' "New After" w { new-window -a } "New At End" W { new-window }
bind -n MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" { select-pane -t = ; send-keys -M } { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' "#{?@pfixa,-,}Kill" X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } }
bind -n M-MouseDown3Pane display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } '' "#{?#{&&:#{buffer_size},#{!:#{pane_in_mode}}},Paste #[underscore]#{=/9/...:buffer_sample},}" p { paste-buffer } '' "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } '' "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } '' "#{?#{!:#{pane_floating_flag}},Horizontal Split,}" h { split-window -h } "#{?#{!:#{pane_floating_flag}},Vertical Split,}" v { split-window -v } '' "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Up,}" u { swap-pane -U } "#{?#{&&:#{!:#{pane_floating_flag}},#{>:#{window_panes},1}},Swap Down,}" d { swap-pane -D } "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } '' "#{?@pfixa,-,}Kill" X { kill-pane } Respawn R { respawn-pane -k } "#{?pane_marked,Unmark,Mark}" m { select-pane -m } "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z }
# Sair do chat, q ou Ctrl-C no painel fixo: ele não fecha (remain-on-exit, posto pelo fixas.sh) e
# volta em 1 s com o mesmo comando. Se a fixa sumir mesmo assim (kill-window digitado num shell),
# o fixas.sh repor recria nas sessões com navegador.
set-hook -g pane-died 'if -F "#{@pfixa}" "run-shell -b \"sleep 1; tmux -S #{socket_path} respawn-pane -k -t #{pane_id}\""'
set-hook -g window-unlinked 'run-shell -b "/usr/local/lib/cloudshell/fixas.sh repor"'

# Botões dos menus no navegador (26/10/2026, host/botoes.sh + pwa/botoes.js, visual do Cmd+Tab): o
# omega e os menus do abas.sh mandam os botões; trocar de aba tira os da aba anterior (a omega e a sh
# mandam de novo em até 3 s quando voltam para a frente). session_name é cs-<dígitos>; o script confere.
set-hook -g session-window-changed 'run-shell -b "/usr/local/lib/cloudshell/botoes.sh esconde #{socket_path} #{session_name}"'

# A janela "conselho" roda como root (sudo + hermes): quando o último navegador sai, ela é
# fechada; na volta o sessao.sh recria e o sudo pede a senha de novo.
# O script fecha a janela conselho de toda sessão sem cliente (não só a de quem saiu: no
# hook, #{session_name} pode vir de outra sessão anexada).
set-hook -g client-detached 'run-shell "/usr/local/lib/cloudshell/fechar-conselho.sh #{socket_path}"'
# O sessao.sh marca a sessão como "abrindo" (para o fechar-conselho.sh não pegar a janela
# recém-criada antes do attach); no attach o marcador sai. session_name é cs-<dígitos>.
# O nome vai para o script, que só aceita cs-<dígitos> (nada de rm com o nome cru no sh -c).
# Também no attach (28/10/2026): a página fica sabendo qual aba está ativa (botoes.sh esconde) — na conselho
# ela abre a página inicial e na omega/sh a tela de Sessões/Scripts, nunca o texto. O sleep espera a página ligar o leitor.
set-hook -g client-attached 'run-shell "/usr/local/lib/cloudshell/fechar-conselho.sh --anexou #{session_name}" ; run-shell -b "sleep 1; /usr/local/lib/cloudshell/botoes.sh esconde #{socket_path} #{session_name}"'

worker_processes 1;
pid /run/nginx/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  types { application/manifest+json webmanifest; }
  server_tokens off;

  # Trilha de quem abriu o terminal: conta do hub (devolvida pelo gateway) + IP real
  # (o túnel da Cloudflare manda em CF-Connecting-IP; $remote_addr é o cloudflared).
  # $cs_conta/$cs_sub vêm do gateway (auth_request_set) só no terminal; fora dele, ou
  # quando a verificação falha, ficam vazias e o log mostra "-".
  map $cs_conta $cs_conta_log { '' '-'; default $cs_conta; }
  # CF-Connecting-IP é header do cliente: só entra no log se tiver forma de IP (senão
  # alguém na rede forjaria linhas de auditoria). peer = quem falou com o nginx (o
  # cloudflared, em produção) — não é forjável e desmente o ip= se divergir.
  map $http_cf_connecting_ip $cs_ip_log { '~^[0-9a-fA-F:.]{3,45}$' $http_cf_connecting_ip; default '-'; }
  # Nunca a query: o magic link do convite (/setup-password?token=…) é uma credencial.
  log_format cloudshell '$time_iso8601 conta=$cs_conta_log ip=$cs_ip_log peer=$remote_addr '
                        '"$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout cloudshell;
  client_body_temp_path /var/lib/nginx/tmp/body;
  proxy_temp_path /var/lib/nginx/tmp/proxy;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    # Redirect relativo: atrás da Cloudflare o Host/porta/esquema internos não valem.
    absolute_redirect off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # Arquivos do PWA (manifest, service worker, ícones) — públicos. Sem log: ruído.
    # inicio.js (27/10/2026): a página inicial com o Conselho desenhado. sessoes.js (carregado pelo
    # inicio.js: o sub_filter já está no limite de tamanho do nginx): a tela de Sessões, com os logos de
    # servidores/<nome>.svg|png.
    # botoes.js (26/10/2026): os botões dos menus no visual do Cmd+Tab (só desenho; o terminal continua
    # atrás do LoginHUB).
    # add_header aqui apaga os do server, por isso os três se repetem.
    location ~ ^/(manifest\.webmanifest|sw\.js|botoes\.js|inicio\.js|sessoes\.js|logos\.js|servidores/[a-z0-9-]+\.(?:png|svg)|[a-z0-9-]+\.png)$ {
      root /srv/pwa;
      access_log off;
      add_header Cache-Control "no-cache";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }

    # Fonte do terminal (JetBrainsMono Nerd Font Mono, OFL): os ícones do eza/starship são
    # glifos Nerd Font que o navegador do aparelho não tem. Pública e imutável (o nome muda
    # se trocar a versão), cache longo.
    location /fontes/ {
      root /srv/pwa;
      access_log off;
      add_header Cache-Control "public, max-age=31536000, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header X-Frame-Options DENY always;
    }

    # Tela de login (LoginHUB + 2FA) e magic link do convite — públicas.
    location /entrar/ {
      alias /srv/web/;
      try_files $uri /entrar/index.html;
    }
    location = /entrar { rewrite ^ /entrar/index.html last; }
    location = /setup-password { rewrite ^ /entrar/index.html last; }
    location = /sair { rewrite ^ /entrar/index.html last; }

    # Gateway: abrir/fechar sessão (públicas) e a conferência (só interna).
    location = /_cs/sessao { proxy_pass http://127.0.0.1:7690/sessao; }
    location = /_cs/sair   { proxy_pass http://127.0.0.1:7690/sair; }
    location = /_cs/verificar {
      internal;
      proxy_pass http://127.0.0.1:7690/verificar;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      # O gateway loga a abertura de cada terminal com conta e IP. A marca vem do
      # location que pediu a conferência (1 no = /ws, 0 no /; a variável é compartilhada
      # com esta subrequisição), então //ws — normalizado para o = /ws — também é logado.
      proxy_set_header X-CloudShell-Terminal $cs_terminal;
    }

    location @entrar { return 302 /entrar; }

    # WebSocket do terminal: cada conexão = um processo cloudshell-login. A query do
    # cliente é descartada e o ttyd (--url-arg) recebe como argumento o id da conta do
    # hub conferido pelo gateway — é o que amarra a sessão SSH à conta no log.
    location = /ws {
      # Sem upgrade não há terminal a abrir.
      if ($http_upgrade = "") { return 404; }
      set $cs_terminal 1;
      auth_request /_cs/verificar;
      auth_request_set $cs_conta $upstream_http_x_cloudshell_usuario;
      auth_request_set $cs_sub $upstream_http_x_cloudshell_sub;
      error_page 401 403 = @entrar;
      # $cs_sub nunca chega vazio aqui: o gateway só responde 204 com X-CloudShell-Sub
      # validado (^[0-9]{1,12}$). Um if aqui não serviria: roda antes do auth_request.

      proxy_pass http://127.0.0.1:7681/ws?arg=$cs_sub;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header Cookie "";
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;
    }

    # Terminal (HTML e /token do ttyd): só com sessão do LoginHUB.
    location / {
      # O ttyd aceita WebSocket em qualquer caminho; fora do /ws (onde o arg é o do
      # gateway) um upgrade levaria o arg forjado pelo cliente. A barreira real é este
      # location não repassar Upgrade/Connection ao ttyd; o if só responde 404 mais cedo.
      if ($http_upgrade) { return 404; }
      set $cs_terminal 0;

      auth_request /_cs/verificar;
      auth_request_set $cs_conta $upstream_http_x_cloudshell_usuario;
      error_page 401 403 = @entrar;

      proxy_pass http://127.0.0.1:7681;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      # O cookie leva o JWT do hub: não entra no processo do terminal.
      proxy_set_header Cookie "";
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;

      # Sem gzip do ttyd para o sub_filter enxergar o HTML. Além do PWA, entra o @font-face
      # da fonte Nerd; o xterm mede a fonte quando abre, então depois que ela carrega o
      # script troca o fontFamily e volta (window.term é do ttyd) para redesenhar com os ícones.
      # O 2º script lê o OSC 52 (cópia do tmux) e grava na área de transferência do navegador
      # (o xterm do ttyd não trata o OSC 52 sozinho). Copiar ao selecionar (25/10/2026): no mouseup de um arraste ou clique duplo (clique simples não: não trava os botões nem o omega) o
      # script já pede a área de transferência com um ClipboardItem que espera o OSC 52 do tmux (até
      # 1,5 s) — o Safari só deixa gravar dentro do gesto, e o OSC 52 chega depois dele; um aviso
      # "copiado ✓" aparece no canto. Também troca Option+C por \e[99~ (User0 do
      # tmux.conf = próxima cor da aba) e Option+V por \e[98~ (User1 = divide com o omega). Option+G por \e[97~ (User2 = menu do ▦ grupo). Option+L manda Esc+l (meta+l), que no Claude Code
      # limpa a caixa de texto (chat:clearInput no ~/.claude/keybindings.json do awlsrv). Pelo
      # e.code (tecla física): no Mac o Option+C sozinho daria "ç". Links: como no Terminal do
      # Mac, Cmd + mouse em cima de um http(s):// mostra a mãozinha e Cmd+clique abre numa aba
      # (o clique não vai para o tmux). O /botoes.js (26/10/2026) desenha os botões dos menus (OSC 7717 do
      # host/botoes.sh) no visual do Cmd+Tab. Sem barra invertida no JS: o nginx trataria \t/\n. Sem "$" aqui: o sub_filter expande variáveis.
      proxy_set_header Accept-Encoding "";
      sub_filter_once on;
      sub_filter '</head>' '<link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#0b0b14"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="icon" href="/favicon-192.png"><script src="/botoes.js" defer></script><script src="/inicio.js" defer></script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js")</script><link rel="preload" href="/fontes/JetBrainsMonoNerdFontMono-Regular.woff2" as="font" type="font/woff2" crossorigin><style>@font-face{font-family:"CloudShell Nerd";src:url(/fontes/JetBrainsMonoNerdFontMono-Regular.woff2) format("woff2");font-weight:400;font-display:block}@font-face{font-family:"CloudShell Nerd";src:url(/fontes/JetBrainsMonoNerdFontMono-Bold.woff2) format("woff2");font-weight:700;font-display:block}</style><script>document.fonts.load("15px \\"CloudShell Nerd\\"").then(function(){var n=0,i=setInterval(function(){var t=window.term;if(t||++n>50)clearInterval(i);if(t){var f=t.options.fontFamily;t.options.fontFamily="monospace";t.options.fontFamily=f;t.fit&&t.fit()}},100)})</script><script>(function(){var n=0,i=setInterval(function(){var t=window.term;if(!t&&++n<100)return;clearInterval(i);if(!t)return;t.parser.registerOscHandler(52,function(d){var b=d.slice(d.indexOf(";")+1);if(!b||b==="?")return true;try{var s=new TextDecoder().decode(Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)}));if(pend)pend(s);else navigator.clipboard.writeText(s).catch(function(){});aviso()}catch(e){}return true});document.addEventListener("keydown",function(e){var k={KeyC:"[99~",KeyV:"[98~",KeyL:"l",KeyG:"[97~"}[e.code];if(e.altKey&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&k){e.preventDefault();e.stopPropagation();var d=String.fromCharCode(27)+k;if(t.input)t.input(d,true);else t._core.coreService.triggerDataEvent(d,true)}},true);var re=/https?:[/][/][^ "<>()│┃]+/g,alvo=null,el=t.element;var pend=null;function aviso(){var a=document.getElementById("cs-copiado");if(!a){a=document.createElement("div");a.id="cs-copiado";a.textContent="copiado ✓";a.style.cssText="position:fixed;right:14px;bottom:14px;z-index:9;background:#b388ff;color:#14141f;font:600 13px system-ui;padding:6px 12px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none";document.body.appendChild(a)}a.style.opacity="1";clearTimeout(a._t);a._t=setTimeout(function(){a.style.opacity="0"},900)}var dx=0,dy=0;el.addEventListener("mousedown",function(e){dx=e.clientX;dy=e.clientY},true);el.addEventListener("mouseup",function(e){if(e.button!==0||e.metaKey||!window.ClipboardItem||!navigator.clipboard||!navigator.clipboard.write)return;if(e.detail<2&&Math.abs(e.clientX-dx)+Math.abs(e.clientY-dy)<6)return;var ok,no,p=new Promise(function(a,b){ok=a;no=b});var to=setTimeout(function(){pend=null;no(new Error("sem cópia"))},1500);pend=function(x){clearTimeout(to);pend=null;ok(new Blob([x],{type:"text/plain"}))};navigator.clipboard.write([new ClipboardItem({"text/plain":p})]).catch(function(){})},true);function url(e){var s=el&&el.querySelector(".xterm-screen");if(!s)return null;var r=s.getBoundingClientRect();var c=Math.floor((e.clientX-r.left)/(r.width/t.cols)),w=Math.floor((e.clientY-r.top)/(r.height/t.rows));if(c<0||w<0||c>=t.cols||w>=t.rows)return null;var b=t.buffer.active,l=b.getLine(b.viewportY+w);if(!l)return null;var x=l.translateToString(false),m;re.lastIndex=0;while((m=re.exec(x))){if(c>=m.index&&c<m.index+m[0].length){var u=m[0];while(/[.,;:!?]/.test(u.slice(-1)))u=u.slice(0,-1);return u}}return null}function para(e){e.preventDefault();e.stopPropagation();e.stopImmediatePropagation()}el.addEventListener("mousedown",function(e){if(!e.metaKey)return;alvo=url(e);if(alvo)para(e)},true);el.addEventListener("mouseup",function(e){if(!e.metaKey||!alvo)return;para(e);var u=alvo;alvo=null;window.open(u,"_blank","noopener")},true);el.addEventListener("mousemove",function(e){el.style.cursor=e.metaKey&&url(e)?"pointer":""},true);window.addEventListener("keyup",function(e){if(e.key==="Meta")el.style.cursor=""})},100)})()</script></head>';
    }
  }
}
